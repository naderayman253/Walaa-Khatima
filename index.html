<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ختمة المصحف كاملة - ولاء أيمن عبدالسلام</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<main class="page">
  <h1>ختمة المصحف كاملة</h1>

  <div class="photo-wrap">
    <img src="Walaa.jpg" alt="ولاء أيمن عبدالسلام">
  </div>

  <h2>اللهم اجعل ثواب هذه الختمة إلى<br>
    <span>المغفور لها / ولاء أيمن عبدالسلام</span>
  </h2>

  <section class="player">
    <audio id="audio" controls preload="metadata"></audio>
    <div class="time" id="time">00:00 / 00:00</div>
    <select id="part">
      <option value="">اختر الجزء</option>
    </select>
    <div class="current" id="current">لم يتم اختيار جزء</div>
  </section>

  <p class="dua">اللهم اغفر لها وارحمها، وعافها واعف عنها.</p>
</main>

<script>
const select = document.getElementById('part');
const audio = document.getElementById('audio');
const current = document.getElementById('current');
const time = document.getElementById('time');

for (let i = 1; i <= 30; i++) {
  const option = document.createElement('option');
  option.value = i;
  option.textContent = `الجزء ${i}`;
  select.appendChild(option);
}

function fmt(s) {
  if (!Number.isFinite(s)) return "00:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return String(m).padStart(2,'0') + ":" + String(sec).padStart(2,'0');
}

select.addEventListener('change', () => {
  const n = select.value;
  if (!n) {
    audio.removeAttribute('src');
    audio.load();
    current.textContent = "لم يتم اختيار جزء";
    return;
  }
  const fileName = String(n).padStart(2, '0') + ".mp3";
  audio.src = fileName;
  current.textContent = `جاري تشغيل: الجزء ${n}`;
  audio.play().catch(() => {});
});

audio.addEventListener('timeupdate', () => {
  time.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
});
audio.addEventListener('loadedmetadata', () => {
  time.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
});
</script>
</body>
</html>
